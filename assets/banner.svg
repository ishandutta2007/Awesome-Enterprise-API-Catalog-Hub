<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accentCyan" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".2"/></linearGradient><linearGradient id="accentPurple" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#a855f7" stop-opacity=".8"/><stop offset="100%" stop-color="#ec4899" stop-opacity=".2"/></linearGradient><filter id="glowCyan" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="glowPurple" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="12"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".3" stroke-width=".75" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes pulse{0%{transform:scale(1);opacity:.4}}@keyframes floatOrb{0%{transform:translate(0,0)}}.node-pulse{animation:pulse 4s ease-in-out infinite alternate}.node-pulse-delayed{animation:pulse 4s ease-in-out 2s infinite alternate}.flow-dash{stroke-dasharray:8 6;animation:flowDash 20s linear infinite}.flow-dash-reverse{stroke-dasharray:6 6;animation:flowDashReverse 15s linear infinite}.float-orb{animation:floatOrb 8s ease-in-out infinite alternate}.pill-text,.sub-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;letter-spacing:-.5px}.sub-text{font-weight:400}.pill-text{font-weight:600;font-size:13px}</style></defs><rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="420" fill="url(#grid)" rx="16"/><g class="float-orb"><circle cx="200" cy="100" r="140" fill="#38bdf8" filter="url(#glowCyan)" opacity=".12"/></g><g class="float-orb" style="animation-delay:-3s"><circle cx="1020" cy="300" r="160" fill="#a855f7" filter="url(#glowPurple)" opacity=".12"/><circle cx="600" cy="380" r="100" fill="#6366f1" filter="url(#glowPurple)" opacity=".08"/></g><g stroke="#38bdf8" stroke-width="1.5" opacity=".4"><path fill="none" d="M 50,340 C 250,280 400,390 600,330 C 800,270 950,380 1150,320" class="flow-dash"/><path fill="none" stroke="#c084fc" stroke-width="1" d="M 80,80 C 300,140 450,50 680,100 C 900,150 1020,40 1120,90" class="flow-dash-reverse" opacity=".3"/><path fill="none" stroke="#818cf8" stroke-width="1" d="M 100,220 C 350,150 850,290 1100,210" class="flow-dash" opacity=".25"/></g><g opacity=".6"><circle cx="120" cy="220" r="6" fill="#38bdf8" class="node-pulse"/><circle cx="120" cy="220" r="14" fill="none" stroke="#38bdf8" stroke-width="1" opacity=".3"/><circle cx="1080" cy="210" r="6" fill="#c084fc" class="node-pulse-delayed"/><circle cx="1080" cy="210" r="14" fill="none" stroke="#c084fc" stroke-width="1" opacity=".3"/><circle cx="320" cy="350" r="5" fill="#818cf8" class="node-pulse"/><circle cx="880" cy="340" r="5" fill="#38bdf8" class="node-pulse-delayed"/></g><g transform="translate(425, 48)"><rect width="350" height="34" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" opacity=".95" rx="17"/><circle cx="20" cy="17" r="5" fill="#10b981"/><text x="35" y="22" fill="#94a3b8" class="pill-text" font-size="12">ENTERPRISE API CATALOG &amp; HUB ECOSYSTEM</text></g><text x="600" y="145" fill="url(#primaryGrad)" class="title-text" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))" font-size="44" text-anchor="middle">Awesome Enterprise API Catalog Hub</text><text x="600" y="190" fill="#e2e8f0" class="sub-text" font-size="18" letter-spacing=".3" text-anchor="middle">Developer Portals, Service Catalogs, Governance &amp; API Discovery Platforms</text><text x="600" y="222" fill="#94a3b8" class="sub-text" font-size="14" text-anchor="middle">Curated SaaS Platforms, Market Dynamics &amp; Open-Source Projects for Platform Teams</text><g><g transform="translate(195, 265) translate(0, 0)"><rect width="180" height="42" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity=".95" rx="10"/><text x="90" y="26" fill="#38bdf8" class="pill-text" text-anchor="middle">⚡ Developer Portals</text></g><g transform="translate(195, 265) translate(205, 0)"><rect width="185" height="42" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" opacity=".95" rx="10"/><text x="92" y="26" fill="#818cf8" class="pill-text" text-anchor="middle">🔍 Service Catalogs</text></g><g transform="translate(195, 265) translate(415, 0)"><rect width="190" height="42" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" opacity=".95" rx="10"/><text x="95" y="26" fill="#c084fc" class="pill-text" text-anchor="middle">🌐 API Marketplaces</text></g><g transform="translate(195, 265) translate(630, 0)"><rect width="180" height="42" fill="#1e293b" stroke="#10b981" stroke-width="1.2" opacity=".95" rx="10"/><text x="90" y="26" fill="#10b981" class="pill-text" text-anchor="middle">🛡️ API Governance</text></g></g><rect width="500" height="3" x="350" y="360" fill="url(#primaryGrad)" opacity=".8" rx="1.5"/></svg>