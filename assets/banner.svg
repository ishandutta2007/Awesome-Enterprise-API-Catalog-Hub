<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <style>
      .node-pulse {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .node-pulse-delayed {
        animation: pulse 4s ease-in-out 2s infinite alternate;
      }
      .flow-dash {
        stroke-dasharray: 8 6;
        animation: flowDash 20s linear infinite;
      }
      .flow-dash-reverse {
        stroke-dasharray: 6 6;
        animation: flowDashReverse 15s linear infinite;
      }
      .float-orb {
        animation: floatOrb 8s ease-in-out infinite alternate;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
      }

      @keyframes flowDash {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -200; }
      }
      @keyframes flowDashReverse {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 200; }
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.4; }
        100% { transform: scale(1.15); opacity: 0.85; }
      }
      @keyframes floatOrb {
        0% { transform: translate(0, 0); }
        100% { transform: translate(25px, -15px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <g class="float-orb">
    <circle cx="200" cy="100" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glowCyan)" />
  </g>
  <g class="float-orb" style="animation-delay: -3s;">
    <circle cx="1020" cy="300" r="160" fill="#a855f7" opacity="0.12" filter="url(#glowPurple)" />
    <circle cx="600" cy="380" r="100" fill="#6366f1" opacity="0.08" filter="url(#glowPurple)" />
  </g>

  <!-- Animated Dynamic Flow Lines & Mesh Behind Content -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.4">
    <path class="flow-dash" fill="none" d="M 50,340 C 250,280 400,390 600,330 C 800,270 950,380 1150,320" />
    <path class="flow-dash-reverse" stroke="#c084fc" stroke-width="1" opacity="0.3" fill="none" d="M 80,80 C 300,140 450,50 680,100 C 900,150 1020,40 1120,90" />
    <path class="flow-dash" stroke="#818cf8" stroke-width="1" opacity="0.25" fill="none" d="M 100,220 C 350,150 850,290 1100,210" />
  </g>

  <!-- Connecting Visual Nodes (Subtle Animated Graph Network) -->
  <g opacity="0.6">
    <circle class="node-pulse" cx="120" cy="220" r="6" fill="#38bdf8" />
    <circle cx="120" cy="220" r="14" stroke="#38bdf8" stroke-width="1" fill="none" opacity="0.3" />
    
    <circle class="node-pulse-delayed" cx="1080" cy="210" r="6" fill="#c084fc" />
    <circle cx="1080" cy="210" r="14" stroke="#c084fc" stroke-width="1" fill="none" opacity="0.3" />

    <circle class="node-pulse" cx="320" cy="350" r="5" fill="#818cf8" />
    <circle class="node-pulse-delayed" cx="880" cy="340" r="5" fill="#38bdf8" />
  </g>

  <!-- FOREGROUND: Content Elements (Always crisp, unobstructed, high contrast) -->
  <!-- Top Category Chip -->
  <g transform="translate(425, 48)">
    <rect width="350" height="34" rx="17" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" opacity="0.95" />
    <circle cx="20" cy="17" r="5" fill="#10b981" />
    <text x="35" y="22" fill="#94a3b8" class="pill-text" font-size="12">ENTERPRISE API CATALOG &amp; HUB ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="145" text-anchor="middle" class="title-text" font-size="44" fill="url(#primaryGrad)" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))">
    Awesome Enterprise API Catalog Hub
  </text>

  <!-- Subtitle -->
  <text x="600" y="190" text-anchor="middle" class="sub-text" font-size="18" fill="#e2e8f0" letter-spacing="0.3">
    Developer Portals, Service Catalogs, Governance &amp; API Discovery Platforms
  </text>

  <!-- Secondary Tagline -->
  <text x="600" y="222" text-anchor="middle" class="sub-text" font-size="14" fill="#94a3b8">
    Curated SaaS Platforms, Market Dynamics &amp; Open-Source Projects for Platform Teams
  </text>

  <!-- Feature Pills / Badges in Foreground -->
  <g transform="translate(195, 265)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
      <text x="90" y="26" text-anchor="middle" fill="#38bdf8" class="pill-text">⚡ Developer Portals</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(205, 0)">
      <rect width="185" height="42" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" opacity="0.95" />
      <text x="92" y="26" text-anchor="middle" fill="#818cf8" class="pill-text">🔍 Service Catalogs</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(415, 0)">
      <rect width="190" height="42" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" opacity="0.95" />
      <text x="95" y="26" text-anchor="middle" fill="#c084fc" class="pill-text">🌐 API Marketplaces</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(630, 0)">
      <rect width="180" height="42" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.2" opacity="0.95" />
      <text x="90" y="26" text-anchor="middle" fill="#10b981" class="pill-text">🛡️ API Governance</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="350" y="360" width="500" height="3" rx="1.5" fill="url(#primaryGrad)" opacity="0.8" />
</svg>
